<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Калькулятор эффекта ИИ Рекрутер</title>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --surface-2: #243044;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #6366f1;
      --accent-light: #818cf8;
      --success: #34d399;
      --warning: #fbbf24;
      --danger: #f87171;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    html {
      font-size: clamp(15px, 0.55vw + 0.9vh, 17px);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
    }

    .page {
      height: 100dvh;
      max-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 14px 18px 16px;
      gap: 12px;
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
    }

    .header-main {
      min-width: 0;
    }

    header h1 {
      font-size: 1.45rem;
      font-weight: 700;
      background: linear-gradient(135deg, #fff 0%, var(--accent-light) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      white-space: nowrap;
    }

    .disclaimer {
      color: var(--warning);
      font-size: 0.78rem;
      margin-top: 4px;
      opacity: 0.95;
    }

    .reset-btn {
      flex-shrink: 0;
      padding: 8px 14px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .reset-btn:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    .dashboard {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(320px, 1.2fr) minmax(250px, 0.78fr) minmax(230px, 0.72fr);
      gap: 12px;
      overflow: hidden;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .card h2 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .card h2::before {
      content: "";
      width: 4px;
      height: 18px;
      background: var(--accent);
      border-radius: 2px;
    }

    .inputs-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 12px;
      flex: 1;
      align-content: space-between;
      overflow: hidden;
    }

    .section-label {
      grid-column: 1 / -1;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent-light);
      margin-top: 4px;
      font-weight: 600;
    }

    .section-label:first-child { margin-top: 0; }

    .field label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 4px;
      line-height: 1.25;
    }

    .field input {
      width: 100%;
      padding: 8px 10px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
      transition: border-color 0.2s;
    }

    .field input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .field.span2 { grid-column: 1 / -1; }

    .results-col {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 0;
      overflow: hidden;
    }

    .card-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 12px;
    }

    .card-results,
    .card-scenarios {
      padding: 14px 12px;
    }

    .card-results h2,
    .card-scenarios h2 {
      margin-bottom: 10px;
    }

    .funnel {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    .funnel-step {
      display: grid;
      grid-template-columns: minmax(88px, 36%) 1fr auto;
      align-items: center;
      gap: 6px;
    }

    .funnel-step .label {
      font-size: 0.78rem;
      color: var(--muted);
      line-height: 1.2;
    }

    .funnel-bar-wrap {
      background: var(--surface-2);
      border-radius: 6px;
      height: 22px;
      overflow: hidden;
    }

    .funnel-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-light));
      border-radius: 6px;
      transition: width 0.3s ease;
      min-width: 2px;
    }

    .funnel-step .value {
      font-weight: 600;
      font-size: 0.88rem;
      min-width: 62px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      flex-shrink: 0;
    }

    .metric {
      background: var(--surface-2);
      border-radius: 8px;
      padding: 8px 6px;
      text-align: center;
    }

    .metric .num {
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--success);
      line-height: 1.2;
      font-variant-numeric: tabular-nums;
    }

    .metric .num.negative { color: var(--danger); }

    .metric .lbl {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 4px;
      line-height: 1.2;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    th, td {
      padding: 8px 8px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    th {
      color: var(--muted);
      font-weight: 500;
      font-size: 0.78rem;
    }

    td.num { text-align: right; font-variant-numeric: tabular-nums; }

    .savings-positive { color: var(--success); font-weight: 700; }
    .savings-negative { color: var(--danger); font-weight: 700; }

    .price-row td:first-child { color: var(--muted); }

    .card-grow {
      flex: 1;
      min-height: 0;
    }

    .table-wrap {
      flex-shrink: 0;
    }

    .card-results table,
    .card-scenarios table {
      font-size: 0.8rem;
    }

    .card-results th,
    .card-results td,
    .card-scenarios th,
    .card-scenarios td {
      padding: 6px 4px;
    }

    .card-scenarios th {
      font-size: 0.72rem;
    }

    #scenarioTable td:first-child {
      font-size: 0.82rem;
    }

    #scenarioTable td.num {
      font-size: 0.84rem;
    }

    @media (max-width: 1100px) {
      html, body { overflow: auto; height: auto; }
      .page { height: auto; max-height: none; overflow: visible; }
      .dashboard { grid-template-columns: 1fr 1fr; overflow: visible; }
      .inputs-card { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="header-main">
        <h1>Калькулятор эффекта ИИ Рекрутер</h1>
        <div class="disclaimer">Внутренняя модель · не гарантия клиенту · телефония, маркировка, интеграция и НДС не включены</div>
      </div>
      <button class="reset-btn" type="button" id="resetBtn">Сбросить</button>
    </header>

    <div class="dashboard">
      <div class="card inputs-card">
        <h2>Входные параметры</h2>
        <div class="inputs-grid">
          <div class="section-label">Пакет AI</div>
          <div class="field">
            <label for="aiMinutes">Пакет минут AI</label>
            <input type="number" id="aiMinutes" value="200000" min="0" step="1000">
          </div>
          <div class="field">
            <label for="aiPrice">Цена AI, ₽</label>
            <input type="number" id="aiPrice" value="3600000" min="0" step="1000">
          </div>
          <div class="field span2">
            <label for="packagePer10k">Звонков на 10 000 минут</label>
            <input type="number" id="packagePer10k" value="21260" min="0" step="1">
          </div>

          <div class="section-label">Воронка</div>
          <div class="field">
            <label for="contactRate">Контакт, %</label>
            <input type="number" id="contactRate" value="26.3" min="0" max="100" step="0.1">
          </div>
          <div class="field">
            <label for="meaningfulRate">Содерж. интервью, %</label>
            <input type="number" id="meaningfulRate" value="50.1" min="0" max="100" step="0.1">
          </div>
          <div class="field span2">
            <label for="relevanceRate">Подходящий кандидат, %</label>
            <input type="number" id="relevanceRate" value="27.1" min="0" max="100" step="0.1">
          </div>

          <div class="section-label">Ручной труд</div>
          <div class="field">
            <label for="manualAttemptMin">Мин. на попытку</label>
            <input type="number" id="manualAttemptMin" value="1" min="0" step="0.1">
          </div>
          <div class="field">
            <label for="manualInterviewMin">Мин. на интервью</label>
            <input type="number" id="manualInterviewMin" value="15" min="0" step="0.1">
          </div>
          <div class="field">
            <label for="recruiterCost">Зарплата рекрутера, ₽</label>
            <input type="number" id="recruiterCost" value="80000" min="0" step="1000">
          </div>
          <div class="field">
            <label for="workingHours">Раб. часов / мес</label>
            <input type="number" id="workingHours" value="160" min="1" step="1">
          </div>
          <div class="field span2">
            <label for="aiControlMin">Контроль AI, мин/интервью</label>
            <input type="number" id="aiControlMin" value="3" min="0" step="0.1">
          </div>

          <div class="section-label">Альтернативы</div>
          <div class="field">
            <label for="hhPerVacancy">hh.ru, ₽/мин</label>
            <input type="number" id="hhPerVacancy" value="17" min="0" step="1">
          </div>
          <div class="field">
            <label for="saasPerEmployee">SaaS, ₽/интервью</label>
            <input type="number" id="saasPerEmployee" value="149" min="0" step="1">
          </div>
        </div>
      </div>

      <div class="results-col">
        <div class="card card-grow card-results">
          <h2>Результат по воронке</h2>
          <div class="card-body">
            <div class="funnel" id="funnel"></div>
            <div class="metrics" id="keyMetrics"></div>
            <div class="table-wrap">
              <table>
                <tbody id="priceTable"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

      <div class="card card-scenarios">
        <h2>Сравнение сценариев</h2>
        <div class="card-body">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Сценарий</th>
                  <th style="text-align:right">Текущие</th>
                  <th style="text-align:right">AI</th>
                  <th style="text-align:right">Экономия</th>
                </tr>
              </thead>
              <tbody id="scenarioTable"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const DEFAULTS = {
      aiMinutes: 200000,
      aiPrice: 3600000,
      packagePer10k: 21260,
      contactRate: 26.3,
      meaningfulRate: 50.1,
      relevanceRate: 27.1,
      manualAttemptMin: 1,
      manualInterviewMin: 15,
      recruiterCost: 80000,
      workingHours: 160,
      aiControlMin: 3,
      hhPerVacancy: 17,
      saasPerEmployee: 149
    };

    const fieldIds = {
      aiMinutes: 'aiMinutes',
      aiPrice: 'aiPrice',
      packagePer10k: 'packagePer10k',
      contactRate: 'contactRate',
      meaningfulRate: 'meaningfulRate',
      relevanceRate: 'relevanceRate',
      manualAttemptMin: 'manualAttemptMin',
      manualInterviewMin: 'manualInterviewMin',
      recruiterCost: 'recruiterCost',
      workingHours: 'workingHours',
      aiControlMin: 'aiControlMin',
      hhPerVacancy: 'hhPerVacancy',
      saasPerEmployee: 'saasPerEmployee'
    };

    function getValues() {
      const v = {};
      for (const [key, id] of Object.entries(fieldIds)) {
        v[key] = parseFloat(document.getElementById(id).value) || 0;
      }
      return v;
    }

    function fmt(n, decimals = 0) {
      if (!isFinite(n)) return '—';
      return n.toLocaleString('ru-RU', {
        minimumFractionDigits: decimals,
        maximumFractionDigits: decimals
      });
    }

    function fmtMoney(n) {
      return fmt(Math.round(n)) + ' ₽';
    }

    function calculate(v) {
      const packageCapacity = Math.round(v.packagePer10k * v.aiMinutes / 10000);
      const actualAttempts = packageCapacity;
      const contacts = actualAttempts * (v.contactRate / 100);
      const meaningfulInterviews = contacts * (v.meaningfulRate / 100);
      const relevantCandidates = meaningfulInterviews * (v.relevanceRate / 100);

      const manualMinutes = actualAttempts * v.manualAttemptMin + meaningfulInterviews * v.manualInterviewMin;
      const manualHours = manualMinutes / 60;
      const aiControlHours = meaningfulInterviews * v.aiControlMin / 60;
      const netSavedHours = manualHours - aiControlHours;
      const savedCost = netSavedHours * v.recruiterCost / v.workingHours;
      const netEffect = savedCost - v.aiPrice;
      const fte = netSavedHours / v.workingHours;

      const pricePerAttempt = v.aiPrice / actualAttempts * 1000;
      const pricePerContact = contacts > 0 ? v.aiPrice / contacts : 0;
      const pricePerInterview = meaningfulInterviews > 0 ? v.aiPrice / meaningfulInterviews : 0;
      const pricePerCandidate = relevantCandidates > 0 ? v.aiPrice / relevantCandidates : 0;

      const hhCost = manualMinutes * v.hhPerVacancy;
      const saasCost = meaningfulInterviews * v.saasPerEmployee;

      return {
        actualAttempts, contacts, meaningfulInterviews, relevantCandidates,
        manualHours, netSavedHours, savedCost, netEffect, fte,
        pricePerAttempt, pricePerContact, pricePerInterview, pricePerCandidate,
        hhCost, saasCost
      };
    }

    function renderFunnel(r) {
      const steps = [
        { label: 'Тарифицируемые звонки', value: r.actualAttempts },
        { label: 'Контакты', value: r.contacts },
        { label: 'Содерж. интервью', value: r.meaningfulInterviews },
        { label: 'Подходящие кандидаты', value: r.relevantCandidates }
      ];
      const max = r.actualAttempts || 1;
      document.getElementById('funnel').innerHTML = steps.map(s => `
        <div class="funnel-step">
          <span class="label">${s.label}</span>
          <div class="funnel-bar-wrap"><div class="funnel-bar" style="width:${Math.max(2, (s.value / max) * 100)}%"></div></div>
          <span class="value">${fmt(s.value)}</span>
        </div>
      `).join('');
    }

    function renderMetrics(r, v) {
      const netClass = r.netEffect >= 0 ? '' : 'negative';
      document.getElementById('keyMetrics').innerHTML = `
        <div class="metric"><div class="num">${fmt(r.manualHours, 1)}</div><div class="lbl">Ручных HR-часов</div></div>
        <div class="metric"><div class="num">${fmt(r.netSavedHours, 1)}</div><div class="lbl">Снятые HR-часы</div></div>
        <div class="metric"><div class="num">${fmt(r.fte, 1)}</div><div class="lbl">FTE рекрутеров</div></div>
        <div class="metric"><div class="num">${fmtMoney(r.savedCost)}</div><div class="lbl">Стоимость снятых часов</div></div>
        <div class="metric"><div class="num ${netClass}">${fmtMoney(r.netEffect)}</div><div class="lbl">Чистый эффект</div></div>
        <div class="metric"><div class="num">${fmt(v.aiPrice / v.aiMinutes, 1)} ₽</div><div class="lbl">Цена минуты AI</div></div>
      `;
    }

    function renderPriceTable(r) {
      document.getElementById('priceTable').innerHTML = `
        <tr class="price-row"><td>Цена AI / 1000 звонков</td><td class="num">${fmt(r.pricePerAttempt, 0)} ₽</td></tr>
        <tr class="price-row"><td>Цена AI / контакт</td><td class="num">${fmt(r.pricePerContact, 0)} ₽</td></tr>
        <tr class="price-row"><td>Цена AI / интервью</td><td class="num">${fmt(r.pricePerInterview, 0)} ₽</td></tr>
        <tr class="price-row"><td>Цена AI / кандидат</td><td class="num">${fmt(r.pricePerCandidate, 0)} ₽</td></tr>
      `;
    }

    function renderScenarios(r, v) {
      const scenarios = [
        { name: 'Один рекрутер', current: r.savedCost, ai: v.aiPrice },
        { name: 'hh.ru', current: r.hhCost, ai: v.aiPrice },
        { name: 'AI-рекрутмент SaaS', current: r.saasCost, ai: v.aiPrice }
      ];
      document.getElementById('scenarioTable').innerHTML = scenarios.map(s => {
        const savings = s.current - s.ai;
        const cls = savings >= 0 ? 'savings-positive' : 'savings-negative';
        return `<tr>
          <td>${s.name}</td>
          <td class="num">${fmtMoney(s.current)}</td>
          <td class="num">${fmtMoney(s.ai)}</td>
          <td class="num ${cls}">${fmtMoney(savings)}</td>
        </tr>`;
      }).join('');
    }

    function recalculate() {
      const v = getValues();
      const r = calculate(v);
      renderFunnel(r);
      renderMetrics(r, v);
      renderPriceTable(r);
      renderScenarios(r, v);
    }

    Object.values(fieldIds).forEach(id => {
      document.getElementById(id).addEventListener('input', recalculate);
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      for (const [key, id] of Object.entries(fieldIds)) {
        document.getElementById(id).value = DEFAULTS[key];
      }
      recalculate();
    });

    recalculate();
  </script>
</body>
</html>
