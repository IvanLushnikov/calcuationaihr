<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Калькулятор эффекта ИИ Рекрутер</title>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --surface-2: #243044;
      --surface-3: #2d3a50;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #6366f1;
      --accent-light: #818cf8;
      --success: #34d399;
      --success-dim: rgba(52, 211, 153, 0.12);
      --warning: #fbbf24;
      --danger: #f87171;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; overflow: hidden; }

    html {
      font-size: clamp(15px, 0.55vw + 0.9vh, 17px);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
    }

    .page {
      height: 100dvh;
      max-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 14px 18px 16px;
      gap: 12px;
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 1.45rem;
      font-weight: 700;
      background: linear-gradient(135deg, #fff 0%, var(--accent-light) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .disclaimer {
      color: var(--warning);
      font-size: 0.76rem;
      margin-top: 3px;
      opacity: 0.9;
    }

    .reset-btn {
      flex-shrink: 0;
      padding: 8px 14px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .reset-btn:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    /* col1 уже, col2 и col3 шире */
    .dashboard {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(220px, 0.68fr) minmax(320px, 1.15fr) minmax(300px, 1.05fr);
      gap: 12px;
      overflow: hidden;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .card h2 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .card h2::before {
      content: "";
      width: 4px;
      height: 18px;
      background: var(--accent);
      border-radius: 2px;
    }

    /* --- Входные: приглушённые --- */
    .inputs-card {
      background: rgba(26, 35, 50, 0.65);
      border-color: rgba(51, 65, 85, 0.6);
      padding: 12px 14px;
    }

    .inputs-card h2 {
      font-size: 0.88rem;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .inputs-card h2::before {
      background: var(--muted);
      height: 14px;
    }

    .inputs-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 10px;
      flex: 1;
      align-content: space-between;
      overflow: hidden;
    }

    .section-label {
      grid-column: 1 / -1;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-top: 2px;
      font-weight: 600;
      opacity: 0.8;
    }

    .section-label:first-child { margin-top: 0; }

    .field label {
      display: block;
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 3px;
      line-height: 1.2;
    }

    .field input {
      width: 100%;
      padding: 6px 8px;
      background: var(--surface-2);
      border: 1px solid rgba(51, 65, 85, 0.7);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.88rem;
      transition: border-color 0.2s;
    }

    .field input:focus {
      outline: none;
      border-color: var(--accent);
      background: var(--surface-3);
    }

    .field.span2 { grid-column: 1 / -1; }

    /* --- Результаты: акцент --- */
    .card-output {
      border-color: rgba(99, 102, 241, 0.35);
      background: linear-gradient(180deg, rgba(99, 102, 241, 0.06) 0%, var(--surface) 40%);
    }

    .card-output h2::before {
      background: var(--success);
    }

    .card-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow: hidden;
    }

    /* Hero KPI */
    .hero-kpi {
      display: grid;
      grid-template-columns: 1.4fr 1fr 1fr 1fr;
      gap: 10px;
      flex-shrink: 0;
    }

    .hero-kpi-main {
      background: var(--success-dim);
      border: 1px solid rgba(52, 211, 153, 0.35);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .hero-kpi-main .kpi-label {
      font-size: 0.78rem;
      color: var(--success);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }

    .hero-kpi-main .kpi-value {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--success);
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }

    .hero-kpi-main .kpi-value.negative {
      color: var(--danger);
    }

    .hero-kpi-main .kpi-sub {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .hero-kpi-item {
      background: var(--surface-2);
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .hero-kpi-item .kpi-value {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      line-height: 1.15;
    }

    .hero-kpi-item .kpi-label {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 4px;
      line-height: 1.2;
    }

    .block-title {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent-light);
      font-weight: 600;
      margin-bottom: 8px;
    }

    .funnel {
      display: flex;
      flex-direction: column;
      gap: 7px;
      flex-shrink: 0;
    }

    .funnel-step {
      display: grid;
      grid-template-columns: minmax(120px, 34%) 1fr auto;
      align-items: center;
      gap: 10px;
    }

    .funnel-step .label {
      font-size: 0.82rem;
      color: var(--muted);
    }

    .funnel-bar-wrap {
      background: var(--surface-2);
      border-radius: 6px;
      height: 24px;
      overflow: hidden;
    }

    .funnel-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-light));
      border-radius: 6px;
      transition: width 0.3s ease;
      min-width: 2px;
    }

    .funnel-step .value {
      font-weight: 700;
      font-size: 0.95rem;
      min-width: 72px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .unit-costs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 16px;
      flex-shrink: 0;
    }

    .unit-cost {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.82rem;
    }

    .unit-cost .lbl { color: var(--muted); }
    .unit-cost .val { font-weight: 600; font-variant-numeric: tabular-nums; }

    /* --- Сценарии --- */
    .card-scenarios {
      border-color: rgba(52, 211, 153, 0.2);
    }

    .card-scenarios h2::before {
      background: var(--success);
    }

    .scenario-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    .scenario-card {
      background: var(--surface-2);
      border-radius: 10px;
      padding: 14px 16px;
      border: 1px solid var(--border);
    }

    .scenario-card.best {
      border-color: rgba(52, 211, 153, 0.4);
      background: rgba(52, 211, 153, 0.06);
    }

    .scenario-name {
      font-size: 0.88rem;
      font-weight: 600;
      margin-bottom: 10px;
      color: var(--text);
    }

    .scenario-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .scenario-row .val {
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .scenario-savings {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .scenario-savings .lbl {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text);
    }

    .scenario-savings .val {
      font-size: 1.15rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .scenario-savings .val.positive { color: var(--success); }
    .scenario-savings .val.negative { color: var(--danger); }

    @media (max-width: 1100px) {
      html, body { overflow: auto; height: auto; }
      .page { height: auto; max-height: none; }
      .dashboard { grid-template-columns: 1fr; overflow: visible; }
      .hero-kpi { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div>
        <h1>Калькулятор эффекта ИИ Рекрутер</h1>
        <div class="disclaimer">Модель для оценки масштаба · не гарантия · телефония и интеграция не включены</div>
      </div>
      <button class="reset-btn" type="button" id="resetBtn">Сбросить</button>
    </header>

    <div class="dashboard">
      <!-- 1: параметры — уже, второстепенно -->
      <div class="card inputs-card">
        <h2>Параметры расчёта</h2>
        <div class="inputs-grid">
          <div class="section-label">Пакет AI</div>
          <div class="field">
            <label for="aiMinutes">Минут AI</label>
            <input type="number" id="aiMinutes" value="200000" min="0" step="1000">
          </div>
          <div class="field">
            <label for="aiPrice">Цена AI, ₽</label>
            <input type="number" id="aiPrice" value="3600000" min="0" step="1000">
          </div>
          <div class="field span2">
            <label for="packagePer10k">Звонков / 10 000 мин</label>
            <input type="number" id="packagePer10k" value="21260" min="0" step="1">
          </div>

          <div class="section-label">Воронка</div>
          <div class="field">
            <label for="contactRate">Контакт, %</label>
            <input type="number" id="contactRate" value="26.3" min="0" max="100" step="0.1">
          </div>
          <div class="field">
            <label for="meaningfulRate">Интервью, %</label>
            <input type="number" id="meaningfulRate" value="50.1" min="0" max="100" step="0.1">
          </div>
          <div class="field span2">
            <label for="relevanceRate">Подходящий, %</label>
            <input type="number" id="relevanceRate" value="27.1" min="0" max="100" step="0.1">
          </div>

          <div class="section-label">Ручной труд</div>
          <div class="field">
            <label for="manualAttemptMin">Мин / попытка</label>
            <input type="number" id="manualAttemptMin" value="1" min="0" step="0.1">
          </div>
          <div class="field">
            <label for="manualInterviewMin">Мин / интервью</label>
            <input type="number" id="manualInterviewMin" value="15" min="0" step="0.1">
          </div>
          <div class="field">
            <label for="recruiterCost">Зарплата, ₽</label>
            <input type="number" id="recruiterCost" value="80000" min="0" step="1000">
          </div>
          <div class="field">
            <label for="workingHours">Часов / мес</label>
            <input type="number" id="workingHours" value="160" min="1" step="1">
          </div>
          <div class="field span2">
            <label for="aiControlMin">Контроль AI, мин</label>
            <input type="number" id="aiControlMin" value="3" min="0" step="0.1">
          </div>

          <div class="section-label">Альтернативы</div>
          <div class="field">
            <label for="hhPerVacancy">hh.ru ₽/мин</label>
            <input type="number" id="hhPerVacancy" value="17" min="0" step="1">
          </div>
          <div class="field">
            <label for="saasPerEmployee">SaaS ₽/инт.</label>
            <input type="number" id="saasPerEmployee" value="149" min="0" step="1">
          </div>
        </div>
      </div>

      <!-- 2: выхлоп и метрики — главный акцент -->
      <div class="card card-output">
        <h2>Ваш результат</h2>
        <div class="card-body">
          <div class="hero-kpi" id="heroKpi"></div>

          <div>
            <div class="block-title">Воронка</div>
            <div class="funnel" id="funnel"></div>
          </div>

          <div>
            <div class="block-title">Стоимость единицы</div>
            <div class="unit-costs" id="unitCosts"></div>
          </div>
        </div>
      </div>

      <!-- 3: сравнение — акцент на экономии -->
      <div class="card card-scenarios">
        <h2>Экономия vs альтернативы</h2>
        <div class="scenario-list" id="scenarioList"></div>
      </div>
    </div>
  </div>

  <script>
    const DEFAULTS = {
      aiMinutes: 200000, aiPrice: 3600000, packagePer10k: 21260,
      contactRate: 26.3, meaningfulRate: 50.1, relevanceRate: 27.1,
      manualAttemptMin: 1, manualInterviewMin: 15, recruiterCost: 80000,
      workingHours: 160, aiControlMin: 3, hhPerVacancy: 17, saasPerEmployee: 149
    };

    const fieldIds = {
      aiMinutes: 'aiMinutes', aiPrice: 'aiPrice', packagePer10k: 'packagePer10k',
      contactRate: 'contactRate', meaningfulRate: 'meaningfulRate', relevanceRate: 'relevanceRate',
      manualAttemptMin: 'manualAttemptMin', manualInterviewMin: 'manualInterviewMin',
      recruiterCost: 'recruiterCost', workingHours: 'workingHours', aiControlMin: 'aiControlMin',
      hhPerVacancy: 'hhPerVacancy', saasPerEmployee: 'saasPerEmployee'
    };

    function getValues() {
      const v = {};
      for (const [key, id] of Object.entries(fieldIds)) {
        v[key] = parseFloat(document.getElementById(id).value) || 0;
      }
      return v;
    }

    function fmt(n, d = 0) {
      if (!isFinite(n)) return '—';
      return n.toLocaleString('ru-RU', { minimumFractionDigits: d, maximumFractionDigits: d });
    }

    function fmtMoney(n) { return fmt(Math.round(n)) + ' ₽'; }

    function calculate(v) {
      const actualAttempts = Math.round(v.packagePer10k * v.aiMinutes / 10000);
      const contacts = actualAttempts * (v.contactRate / 100);
      const meaningfulInterviews = contacts * (v.meaningfulRate / 100);
      const relevantCandidates = meaningfulInterviews * (v.relevanceRate / 100);
      const manualMinutes = actualAttempts * v.manualAttemptMin + meaningfulInterviews * v.manualInterviewMin;
      const manualHours = manualMinutes / 60;
      const aiControlHours = meaningfulInterviews * v.aiControlMin / 60;
      const netSavedHours = manualHours - aiControlHours;
      const savedCost = netSavedHours * v.recruiterCost / v.workingHours;
      const netEffect = savedCost - v.aiPrice;
      const fte = netSavedHours / v.workingHours;
      return {
        actualAttempts, contacts, meaningfulInterviews, relevantCandidates,
        manualHours, netSavedHours, savedCost, netEffect, fte,
        pricePerAttempt: v.aiPrice / actualAttempts * 1000,
        pricePerContact: contacts > 0 ? v.aiPrice / contacts : 0,
        pricePerInterview: meaningfulInterviews > 0 ? v.aiPrice / meaningfulInterviews : 0,
        pricePerCandidate: relevantCandidates > 0 ? v.aiPrice / relevantCandidates : 0,
        hhCost: manualMinutes * v.hhPerVacancy,
        saasCost: meaningfulInterviews * v.saasPerEmployee
      };
    }

    function renderHero(r) {
      const neg = r.netEffect < 0 ? ' negative' : '';
      document.getElementById('heroKpi').innerHTML = `
        <div class="hero-kpi-main">
          <div class="kpi-label">Чистый эффект</div>
          <div class="kpi-value${neg}">${fmtMoney(r.netEffect)}</div>
          <div class="kpi-sub">экономия минус стоимость AI</div>
        </div>
        <div class="hero-kpi-item">
          <div class="kpi-value">${fmt(r.netSavedHours, 0)}</div>
          <div class="kpi-label">снятых HR-часов</div>
        </div>
        <div class="hero-kpi-item">
          <div class="kpi-value">${fmt(r.relevantCandidates)}</div>
          <div class="kpi-label">подходящих кандидатов</div>
        </div>
        <div class="hero-kpi-item">
          <div class="kpi-value">${fmt(r.fte, 1)}</div>
          <div class="kpi-label">экв. рекрутеров (FTE)</div>
        </div>
      `;
    }

    function renderFunnel(r) {
      const steps = [
        { label: 'Тарифицируемые звонки', value: r.actualAttempts },
        { label: 'Контакты', value: r.contacts },
        { label: 'Содержательные интервью', value: r.meaningfulInterviews },
        { label: 'Подходящие кандидаты', value: r.relevantCandidates }
      ];
      const max = r.actualAttempts || 1;
      document.getElementById('funnel').innerHTML = steps.map(s => `
        <div class="funnel-step">
          <span class="label">${s.label}</span>
          <div class="funnel-bar-wrap"><div class="funnel-bar" style="width:${Math.max(2, (s.value / max) * 100)}%"></div></div>
          <span class="value">${fmt(s.value)}</span>
        </div>
      `).join('');
    }

    function renderUnitCosts(r) {
      document.getElementById('unitCosts').innerHTML = `
        <div class="unit-cost"><span class="lbl">За 1000 звонков</span><span class="val">${fmt(r.pricePerAttempt, 0)} ₽</span></div>
        <div class="unit-cost"><span class="lbl">За контакт</span><span class="val">${fmt(r.pricePerContact, 0)} ₽</span></div>
        <div class="unit-cost"><span class="lbl">За интервью</span><span class="val">${fmt(r.pricePerInterview, 0)} ₽</span></div>
        <div class="unit-cost"><span class="lbl">За кандидата</span><span class="val">${fmt(r.pricePerCandidate, 0)} ₽</span></div>
      `;
    }

    function renderScenarios(r, v) {
      const scenarios = [
        { name: 'Один рекрутер', current: r.savedCost, ai: v.aiPrice },
        { name: 'hh.ru', current: r.hhCost, ai: v.aiPrice },
        { name: 'AI-рекрутмент SaaS', current: r.saasCost, ai: v.aiPrice }
      ];
      const maxSaving = Math.max(...scenarios.map(s => s.current - s.ai));
      document.getElementById('scenarioList').innerHTML = scenarios.map(s => {
        const savings = s.current - s.ai;
        const cls = savings >= 0 ? 'positive' : 'negative';
        const best = savings === maxSaving && savings > 0 ? ' best' : '';
        return `
          <div class="scenario-card${best}">
            <div class="scenario-name">${s.name}</div>
            <div class="scenario-row"><span>Сейчас</span><span class="val">${fmtMoney(s.current)}</span></div>
            <div class="scenario-row"><span>С AI Recruiter</span><span class="val">${fmtMoney(s.ai)}</span></div>
            <div class="scenario-savings">
              <span class="lbl">Экономия</span>
              <span class="val ${cls}">${fmtMoney(savings)}</span>
            </div>
          </div>`;
      }).join('');
    }

    function recalculate() {
      const v = getValues();
      const r = calculate(v);
      renderHero(r);
      renderFunnel(r);
      renderUnitCosts(r);
      renderScenarios(r, v);
    }

    Object.values(fieldIds).forEach(id => {
      document.getElementById(id).addEventListener('input', recalculate);
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      for (const [key, id] of Object.entries(fieldIds)) {
        document.getElementById(id).value = DEFAULTS[key];
      }
      recalculate();
    });

    recalculate();
  </script>
</body>
</html>
